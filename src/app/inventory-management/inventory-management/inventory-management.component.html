<div class="wrapper">
    
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
    <!-- Image Column -->
    <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> Image </th>
        <td mat-cell *matCellDef="let element"> 
            <img class="productImage" src="{{element.image}}" />    
        </td>
      </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>
  
    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element"> {{element.category}} </td>
    </ng-container>
  
    <!-- Price Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Price </th>
      <td mat-cell *matCellDef="let element"> {{element.price}} </td>
    </ng-container>

    <!-- Stock In Column -->
    <ng-container matColumnDef="stockin">
        <th mat-header-cell *matHeaderCellDef> Stock In </th>
        <td mat-cell *matCellDef="let element"> {{element.stockin}} </td>
      </ng-container>

      <!-- Stock Out Column -->
    <ng-container matColumnDef="stockout">
        <th mat-header-cell *matHeaderCellDef> Stock Out </th>
        <td mat-cell *matCellDef="let element"> {{element.stockout}} </td>
      </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
<!-- 
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator> -->

  <mat-paginator
  #paginator
  [pageSizeOptions]="pageSizes"
  showFirstLastButtons
></mat-paginator>

</div>
